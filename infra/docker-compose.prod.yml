# Production stack on a single VPS. Started by deploy.sh with IMAGE_REPO and IMAGE_TAG set.
# Service images must define HEALTHCHECK so that `up --wait` and replica restarts work.
name: roflomarket

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - gateway

  web:
    image: ${IMAGE_REPO:?}/web:${IMAGE_TAG:?}
    restart: unless-stopped
    deploy:
      replicas: 2

  gateway:
    image: ${IMAGE_REPO:?}/gateway:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: .env
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy

  engine:
    image: ${IMAGE_REPO:?}/engine:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: .env
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy

  # One-off migration jobs, run by deploy.sh before the new version starts.
  gateway-migrate:
    image: ${IMAGE_REPO:?}/gateway:${IMAGE_TAG:?}
    profiles: [tools]
    env_file: .env
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  engine-migrate:
    image: ${IMAGE_REPO:?}/engine:${IMAGE_TAG:?}
    profiles: [tools]
    env_file: .env
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  caddy_data:
  caddy_config:
